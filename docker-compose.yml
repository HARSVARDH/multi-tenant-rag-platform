version: "3.9"

services:

  api:
    build: ./backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    depends_on:
      - postgres
      - redis
      - qdrant

  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: enterprise_ai

    ports:
      - "55433:5432"

  redis:
    image: redis:7

    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant

    ports:
      - "6333:6333"